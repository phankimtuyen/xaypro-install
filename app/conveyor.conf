// Cấu hình Conveyor để đóng gói XâyPro cho Windows (và các nền tảng khác).
// Metadata + dependency được lấy tự động từ Gradle qua hashbang include.
include "#!./gradlew -q printConveyorConfig"

app {
  display-name = "XâyPro"
  fsname = "xaypro"
  rdns-name = "com.xaypro.app"

  // localhost = chế độ thử nghiệm (miễn phí, tự ký). Đổi sang URL thật khi phát hành.
  site.base-url = "localhost:3000"

  // Chỉ cần Windows 64-bit cho yêu cầu hiện tại.
  machines = [ "windows.amd64" ]
}

conveyor.compatibility-level = 23
